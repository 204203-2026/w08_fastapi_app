# aqi-fixture routing: AQI_BASE_URL=http://aqi-fixture/<scenario> means student
# code appends its own path + query string, e.g. GET /normal/v1/air-quality?lat=..
# Whatever comes after the first path segment (and any query string) is ignored;
# only the scenario name selects which JSON file gets served.
server {
    listen 80 default_server;
    root /usr/share/nginx/html;

    # upstream_down: any path under this scenario returns a bare 503,
    # simulating the real Open-Meteo host being unavailable.
    location ~ ^/upstream_down(/|$) {
        return 503;
    }

    # every other scenario: /<scenario>/whatever?query=1 -> <scenario>.json
    # $uri already excludes the query string, so query params never reach here.
    location ~ ^/(?<scenario>[A-Za-z0-9_-]+)(/.*)?$ {
        default_type application/json;
        try_files /$scenario.json =404;
    }

    location = / {
        default_type application/json;
        return 404 '{"error": "specify a scenario, e.g. /normal/v1/air-quality"}';
    }
}
